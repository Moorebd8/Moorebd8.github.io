<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryuhei Aoyama / 青山 龍平</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #fff; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    /* hide horizontal scrollbar on nav menu */
    .nav-menu::-webkit-scrollbar { display: none; }
    .nav-menu { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">


const { useState, useEffect, useRef } = React;

const F = '"Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
const C = {
  bg: '#FFFFFF', gray: '#F5F5F7', dark: '#000000',
  text: '#1D1D1F', sec: '#6E6E73', tert: '#AEAEB2',
  blue: '#0066CC', blueD: '#2997FF',
  green: '#30D158', yellow: '#FFD60A', orange: '#FF9F0A',
  border: 'rgba(0,0,0,0.09)',
};
const s = (size, weight = 400, color = C.text, extra = {}) =>
  ({ fontFamily: F, fontSize: size, fontWeight: weight, color, ...extra });

/* breakpoint hook ── true under 760px */
const useIsMobile = (bp = 760) => {
  const [m, setM] = useState(typeof window !== 'undefined' ? window.innerWidth < bp : false);
  useEffect(() => {
    const fn = () => setM(window.innerWidth < bp);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, [bp]);
  return m;
};

/* scroll-reveal */
const useFade = () => useEffect(() => {
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; obs.unobserve(e.target); }
  }), { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });
  document.querySelectorAll('[data-fade]').forEach((el, i) => {
    if (el.getBoundingClientRect().top < window.innerHeight) {
      el.style.opacity = '1'; el.style.transform = 'none';
    } else {
      el.style.opacity = '0'; el.style.transform = 'translateY(24px)';
      el.style.transition = `opacity .72s ${(i % 5) * .07}s ease,transform .72s ${(i % 5) * .07}s ease`;
      obs.observe(el);
    }
  });
  return () => obs.disconnect();
}, []);

/* neural-net canvas */
const NetworkBg = () => {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const resize = () => { c.width = c.offsetWidth || window.innerWidth; c.height = c.offsetHeight || window.innerHeight; };
    resize(); window.addEventListener('resize', resize);
    const ctx = c.getContext('2d');
    const count = window.innerWidth < 760 ? 24 : 40;
    const pts = Array.from({ length: count }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      vx: (Math.random() - .5) * .38, vy: (Math.random() - .5) * .38
    }));
    let raf;
    const draw = () => {
      ctx.clearRect(0, 0, c.width, c.height);
      pts.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > c.width) p.vx *= -1;
        if (p.y < 0 || p.y > c.height) p.vy *= -1;
      });
      pts.forEach((a, i) => pts.slice(i + 1).forEach(b => {
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 135) {
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(255,255,255,${.055 * (1 - d / 135)})`; ctx.lineWidth = .8; ctx.stroke();
        }
      }));
      pts.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fill();
      });
      raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={ref} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: .55 }} />;
};

/* ── NAV ── */
const Nav = () => {
  const [sc, setSc] = useState(false);
  const isMobile = useIsMobile();
  useEffect(() => {
    const fn = () => setSc(window.scrollY > 50);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  const goto = id => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.offsetTop - 44, behavior: 'smooth' }); };
  const col = sc ? C.text : '#f0f0f0';
  return (
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100, height: '44px',
      background: sc ? 'rgba(255,255,255,0.85)' : 'rgba(0,0,0,0.85)',
      backdropFilter: 'saturate(180%) blur(20px)', WebkitBackdropFilter: 'saturate(180%) blur(20px)',
      borderBottom: `0.5px solid ${sc ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.1)'}`,
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      padding: isMobile ? '0 14px' : '0 24px', transition: 'background .4s, border-color .4s', gap: '10px'
    }}>
      <span onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
        style={{ ...s(isMobile ? '13px' : '14px', 500, col), letterSpacing: '-0.01em', cursor: 'pointer', transition: 'color .4s', whiteSpace: 'nowrap', flexShrink: 0 }}>
        {isMobile ? 'R. Aoyama' : 'Ryuhei Aoyama'}
      </span>
      <div className="nav-menu" style={{
        display: 'flex', gap: isMobile ? '14px' : '22px',
        overflowX: isMobile ? 'auto' : 'visible',
        minWidth: 0,
      }}>
        {[['about', 'About'], ['anatom', 'Anatom-AI'], ['works', '実績'], ['timeline', '経歴'], ['contact', '連絡']].map(([id, lb]) => (
          <button key={id} onClick={() => goto(id)} style={{
            background: 'none', border: 'none', cursor: 'pointer', padding: 0,
            ...s(isMobile ? '11px' : '12px', 400, col), opacity: .8, transition: 'opacity .15s, color .4s', whiteSpace: 'nowrap'
          }}
            onMouseEnter={e => e.currentTarget.style.opacity = '1'}
            onMouseLeave={e => e.currentTarget.style.opacity = '.8'}
          >{lb}</button>
        ))}
      </div>
    </nav>
  );
};

/* ── HERO ── */

          {['医師', 'Anatom-AI Co-founder'].map(lb => (
            <span key={lb} style={{
              ...s(isMobile ? '11px' : '12px', 500, 'rgba(255,255,255,0.55)'),

            }}>{lb}</span>
          ))}
        </div>
        <h1 style={{ ...s('clamp(28px,7vw,64px)', 700, '#FFFFFF'), lineHeight: 1.15, letterSpacing: '-0.025em', marginBottom: '22px', textWrap: 'balance' }}>
          医療を再考する——<br />社会的見地と技術革新から。
        </h1>
        <p style={{ ...s(isMobile ? '15px' : '18px', 300, C.sec), letterSpacing: '.04em', marginBottom: isMobile ? '36px' : '44px' }}>
          Ryuhei Aoyama / 青山 龍平 · Moore
        </p>
        <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
          <button onClick={() => { const el = document.getElementById('anatom'); if (el) window.scrollTo({ top: el.offsetTop - 44, behavior: 'smooth' }); }}
            style={{ background: C.blueD, border: 'none', borderRadius: '980px', padding: isMobile ? '13px 24px' : '14px 28px', cursor: 'pointer', ...s(isMobile ? '14px' : '15px', 500, '#fff'), transition: 'background .2s' }}
            onMouseEnter={e => e.currentTarget.style.background = '#007AFF'}
            onMouseLeave={e => e.currentTarget.style.background = C.blueD}>
            Anatom-AIを知る
          </button>
          <button onClick={() => { const el = document.getElementById('contact'); if (el) window.scrollTo({ top: el.offsetTop - 44, behavior: 'smooth' }); }}
            style={{ background: 'transparent', border: '1px solid rgba(255,255,255,0.25)', borderRadius: '980px', padding: isMobile ? '13px 24px' : '14px 28px', cursor: 'pointer', ...s(isMobile ? '14px' : '15px', 500, '#fff'), transition: 'border-color .2s' }}
            onMouseEnter={e => e.currentTarget.style.borderColor = 'rgba(255,255,255,0.55)'}
            onMouseLeave={e => e.currentTarget.style.borderColor = 'rgba(255,255,255,0.25)'}>
            連絡する
          </button>
        </div>
      </div>
      <div style={{ position: 'absolute', bottom: '24px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px' }}>
        <span style={{ ...s('9px', 400, '#3A3A3C'), letterSpacing: '.35em', textTransform: 'uppercase' }}>scroll</span>
        <div style={{ width: '1px', height: '36px', background: 'linear-gradient(to bottom, #3A3A3C, transparent)' }} />
      </div>
    </section>
  );
};

/* ── ABOUT ── */

        <div style={{

/* ── TIMELINE ── */
const Timeline = () => {
  const isMobile = useIsMobile();
